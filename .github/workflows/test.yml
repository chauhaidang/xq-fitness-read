name: Test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html/
          retention-days: 7

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: build/test-results/test/*.xml
          check_name: Unit Test Results

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run build without tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build -x test --no-daemon

      - name: Check code style
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew checkstyleMain checkstyleTest || true

  component-tests:
    name: Component Tests (Real API)
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com/'
          scope: '@chauhaidang'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install global tools
        run: |
          npm install -g @chauhaidang/xq-test-infra
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: build read-service
        run: |
          chmod +x ./build-read-service.sh
          ./build-read-service.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start up environment
        run: |
          xq-infra generate -f ./test-env
          xq-infra up

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run component tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew componentTest --no-daemon

      - name: Upload component test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-results
          path: |
            build/reports/tests/componentTest/
            build/test-results/componentTest/
          retention-days: 7

      - name: Stop test environment
        if: always()
        run: |
          echo "Stopping services..."
          xq-infra down
          echo "Test environment stopped"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality, component-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "### Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "### Component Tests: ${{ needs.component-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.unit-tests.result }}" == "success" && \
                "${{ needs.code-quality.result }}" == "success" && \
                "${{ needs.component-tests.result }}" == "success" ]]; then
            echo "✅ All checks passed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ 66 unit tests passed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Code quality checks passed" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ 11 component tests passed (real API)" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "❌ Some checks failed!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
              echo "- ❌ Unit tests failed" >> $GITHUB_STEP_SUMMARY
            fi
            if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
              echo "- ❌ Code quality checks failed" >> $GITHUB_STEP_SUMMARY
            fi
            if [[ "${{ needs.component-tests.result }}" != "success" ]]; then
              echo "- ❌ Component tests failed" >> $GITHUB_STEP_SUMMARY
            fi
            exit 1
          fi
