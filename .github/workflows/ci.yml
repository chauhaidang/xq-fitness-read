name: Build Test Publish Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  XQ_TEST_INFRA_VERSION: "1.0.3"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xq-fitness-read-service
  GITHUB_OWNER: ${{ github.repository_owner }}
  SERVICE_NAME: read-service
  APP_ID: 7960143e-c80f-496d-9992-f24430bb77ff
  APP_NAME: xq-fitness
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DO_TOKEN: ${{ secrets.DO_TOKEN }}

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com/"
          scope: "@chauhaidang"

      - name: Install global tools
        run: |
          npm install -g @chauhaidang/xq-test-infra@${{ env.XQ_TEST_INFRA_VERSION }}
          npm install -g @openapitools/openapi-generator-cli

      - name: Build service
        run: |
          chmod +x ./build-read-service.sh
          ./build-read-service.sh

      - name: Generate API client
        run: npm run generate:client

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test/component/tsr/
            coverage/
          retention-days: 7

  component-tests:
    name: Run Component Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          registry-url: "https://npm.pkg.github.com/"
          scope: "@chauhaidang"

      - name: Fetch XQ scripts
        run: |
          chmod +x ./download-xq-scripts.sh
          ./download-xq-scripts.sh

      - name: Install global tools
        run: |
          npm install -g @chauhaidang/xq-test-infra@${{ env.XQ_TEST_INFRA_VERSION }}
          npm install -g @openapitools/openapi-generator-cli

      - name: Build service
        run: |
          chmod +x ./build-read-service.sh
          ./build-read-service.sh

      - name: Generate API client
        run: npm run generate:client

      - name: Install dependencies
        run: npm ci

      - name: Start up environment
        run: xq-infra generate -f ./test-env && xq-infra up

      - name: Run component tests
        run: npm run test:component:ci

      - name: Stop environment
        if: always()
        run: |
          xq-infra logs
          xq-infra down

      - name: Present test report
        if: success() || failure()
        run: cat test/component/tsr/report.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

      - name: Generate HTML Report
        if: success() || failure()
        run: |
          node scripts/scripts/generate-report.js \
            --xml test/component/tsr/junit.xml \
            --output index.html 
          mkdir public
          mv index.html public/

      - name: Upload Pages Artifact
        if: success() || failure()
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: public

  dockerize-and-deploy:
    name: Build and Deploy
    needs: [unit-tests, component-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v5
        with:
          context: ./
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Install doctl and dependencies
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Install additional dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gettext-base
          # Install yq for YAML manipulation
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Resolve database connection (Neon)
        id: resolve-db
        env:
          NEON_DB_HOST: ${{ secrets.NEON_DB_HOST }}
          NEON_DB_PORT: ${{ secrets.NEON_DB_PORT }}
          NEON_DB_NAME: ${{ secrets.NEON_DB_NAME }}
          NEON_DB_USER: ${{ secrets.NEON_DB_USER }}
          NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
          NEON_DATASOURCE_URL: ${{ secrets.NEON_DATASOURCE_URL }}
        run: |
          # Read-service uses DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD (Neon only)
          if [ -n "${NEON_DB_HOST:-}" ] && [ -n "${NEON_DB_PORT:-}" ] && [ -n "${NEON_DB_NAME:-}" ] && [ -n "${NEON_DB_USER:-}" ] && [ -n "${NEON_DB_PASSWORD:-}" ]; then
            echo ">> Using Neon database (NEON_DB_* secrets)"
            echo "db_host=${NEON_DB_HOST}" >> $GITHUB_OUTPUT
            echo "db_port=${NEON_DB_PORT}" >> $GITHUB_OUTPUT
            echo "db_name=${NEON_DB_NAME}" >> $GITHUB_OUTPUT
            echo "db_user=${NEON_DB_USER}" >> $GITHUB_OUTPUT
            echo "db_password=${NEON_DB_PASSWORD}" >> $GITHUB_OUTPUT
            echo "  Host: $NEON_DB_HOST  Port: $NEON_DB_PORT  DB: $NEON_DB_NAME  User: $NEON_DB_USER"
            exit 0
          fi
          if [ -n "${NEON_DATASOURCE_URL:-}" ] && [ -n "${NEON_DB_USER:-}" ] && [ -n "${NEON_DB_PASSWORD:-}" ]; then
            echo ">> Using Neon database (parsed from NEON_DATASOURCE_URL)"
            if [[ "$NEON_DATASOURCE_URL" =~ jdbc:postgresql://([^:/]+):([0-9]+)/([^?]+) ]]; then
              echo "db_host=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
              echo "db_port=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
              echo "db_name=${BASH_REMATCH[3]}" >> $GITHUB_OUTPUT
            elif [[ "$NEON_DATASOURCE_URL" =~ postgres://[^/]*@([^:/]+):([0-9]+)/([^?/]+) ]]; then
              echo "db_host=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
              echo "db_port=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
              echo "db_name=${BASH_REMATCH[3]}" >> $GITHUB_OUTPUT
            else
              echo "db_host=neon" >> $GITHUB_OUTPUT
              echo "db_port=5432" >> $GITHUB_OUTPUT
              echo "db_name=xq_fitness" >> $GITHUB_OUTPUT
            fi
            echo "db_user=${NEON_DB_USER}" >> $GITHUB_OUTPUT
            echo "db_password=${NEON_DB_PASSWORD}" >> $GITHUB_OUTPUT
            echo "  User: $NEON_DB_USER (host/port/db from URL)"
            exit 0
          fi
          echo "Error: Neon database secrets not set. Configure NEON_DB_HOST, NEON_DB_PORT, NEON_DB_NAME, NEON_DB_USER, NEON_DB_PASSWORD (or NEON_DATASOURCE_URL with NEON_DB_USER and NEON_DB_PASSWORD)." >&2
          exit 1

      - name: Determine image tag
        id: image-tag
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///')
            echo "tag=${BRANCH_NAME}-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          fi

      - name: Render app spec
        id: render-spec
        env:
          APP_NAME: "xq-fitness"
          REGION: "sgp1"
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag || 'latest' }}
          GITHUB_REGISTRY_CREDENTIALS: ${{ env.GITHUB_OWNER }}:${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          DB_HOST: ${{ steps.resolve-db.outputs.db_host }}
          DB_PORT: ${{ steps.resolve-db.outputs.db_port }}
          DB_USER: ${{ steps.resolve-db.outputs.db_user }}
          DB_PASSWORD: ${{ steps.resolve-db.outputs.db_password }}
          DB_NAME: ${{ steps.resolve-db.outputs.db_name }}
        run: |
          export APP_NAME="${APP_NAME}"
          export REGION="${REGION}"
          export IMAGE_NAME="${IMAGE_NAME}"
          export IMAGE_TAG="${IMAGE_TAG:-latest}"
          export DB_HOST="${DB_HOST}"
          export DB_PORT="${DB_PORT}"
          export DB_USER="${DB_USER}"
          export DB_PASSWORD="${DB_PASSWORD}"
          export DB_NAME="${DB_NAME}"
          echo ">> Variables for substitution:"
          echo "  APP_NAME: $APP_NAME  REGION: $REGION  IMAGE_NAME: $IMAGE_NAME  IMAGE_TAG: $IMAGE_TAG"
          echo "  DB_HOST: $DB_HOST  DB_PORT: $DB_PORT  DB_USER: $DB_USER  DB_NAME: $DB_NAME"
          envsubst < .do/app.yaml > .do/app.rendered.yaml
          echo "✓ Rendered app spec"
          head -n 30 .do/app.rendered.yaml

      - name: Merge app spec with existing services
        id: merge-spec
        env:
          APP_NAME: "xq-fitness"
          GITHUB_REGISTRY_CREDENTIALS: ${{ github.repository_owner }}:${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ steps.resolve-db.outputs.db_password }}
        run: |
          set -euo pipefail
          if [ ! -f .do/app.rendered.yaml ]; then
            echo "Error: Rendered app spec file not found" >&2
            exit 1
          fi
          chmod +x scripts/merge-app-spec.sh
          ./scripts/merge-app-spec.sh .do/app.rendered.yaml "$APP_NAME" .do/app.merged.yaml
          echo "merged_spec_file=.do/app.merged.yaml" >> $GITHUB_OUTPUT
          echo "✓ Merged app spec: .do/app.merged.yaml"

      - name: Create or update App Platform app
        id: app-setup
        run: |
          set -euo pipefail
          MERGED_SPEC="${{ steps.merge-spec.outputs.merged_spec_file }}"
          if [ ! -f "$MERGED_SPEC" ]; then
            echo "Error: Merged spec file not found: $MERGED_SPEC" >&2
            exit 1
          fi
          echo "Updating existing app: $APP_ID"
          if ! doctl apps update "$APP_ID" --spec "$MERGED_SPEC" --output json >/dev/null 2>&1; then
            echo "Error updating app" >&2
            exit 1
          fi
          echo "✓ Updated app: $APP_ID"
          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT

      - name: Deploy to App Platform
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DO_TOKEN }}
          app_name: ${{ secrets.APP_NAME || 'xq-fitness' }}
          app_spec_location: ${{ steps.merge-spec.outputs.merged_spec_file }}
          print_deploy_logs: true

  deploy-report:
    if: (success() || failure()) && github.ref == 'refs/heads/main'
    needs: component-tests
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
