name: ${APP_NAME}
region: ${REGION}
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: read-service
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xs
    routes:
      - path: /xq-fitness-read-service
        preserve_path_prefix: false
    image:
      registry_type: GHCR
      registry: ghcr.io
      repository: ${IMAGE_NAME}
      tag: ${IMAGE_TAG}
      registry_credentials: "${GITHUB_REGISTRY_CREDENTIALS}"
    envs:
      - key: SERVER_PORT
        type: GENERAL
        scope: RUN_TIME
        value: "8080"
      - key: SPRING_DATASOURCE_URL
        type: GENERAL
        scope: RUN_TIME
        value: ${SPRING_DATASOURCE_URL}
      - key: SPRING_DATASOURCE_USERNAME
        type: GENERAL
        scope: RUN_TIME
        value: ${DB_USER}
      - key: SPRING_DATASOURCE_PASSWORD
        type: SECRET
        scope: RUN_TIME
        value: ${DB_PASSWORD}
    health_check:
      http_path: /actuator/health
      initial_delay_seconds: 30


