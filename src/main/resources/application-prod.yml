# Production profile: reduce logging and JPA overhead to lower memory and CPU on DO (basic-xs 512MB)
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    org.springframework.web: WARN
    com.xqfitness: INFO
    org.hibernate.SQL: WARN
