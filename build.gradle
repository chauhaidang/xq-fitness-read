plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'xq-test' version '2.3.0'
    id 'xq-dev' version '2.2.1'
}

group = 'com.xqfitness'
version = '1.0.0'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // Spring Boot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring Boot Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Boot Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'

    // Spring WebFlux for WebClient (needed by generated API client)
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux'

    // TestNG for component tests
    testImplementation 'org.testng:testng:7.8.0'

    // Generated API client for component tests (WebClient-based)
    // Exclude JAX-RS provider to avoid JAXB dependency conflicts (not needed for WebClient)
    testImplementation('com.xqfitness.client:read-service-client:1.1.1') {
        exclude group: 'com.fasterxml.jackson.jaxrs', module: 'jackson-jaxrs-json-provider'
    }
}

// Force Spring Framework version to ensure headerSet() method is available
// Spring Boot 3.4.1 uses Spring Framework 6.2.x which includes headerSet()
// This ensures compatibility with the generated API client
configurations.all {
    resolutionStrategy {
        force 'org.springframework:spring-core:6.2.2'
        force 'org.springframework:spring-web:6.2.2'
        force 'org.springframework:spring-webflux:6.2.2'
        force 'org.springframework:spring-context:6.2.2'
    }
}

// Configure test task to run both JUnit and TestNG tests
test {
    useJUnitPlatform()

    // Exclude TestNG component tests from JUnit runner
    exclude '**/component/**/*ApiComponentTest.class'
}

// Create separate task for component tests using TestNG
task componentTest(type: Test) {
    description = 'Runs component tests against real API endpoints using TestNG'
    group = 'verification'

    useTestNG() {
        suites 'src/test/resources/testng.xml'
    }

    // Only run component tests
    include '**/component/**/*ApiComponentTest.class'
}

apiClientGeneration {
    apiDefinitionFiles = ['read-service-api.yaml']
}