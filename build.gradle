plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'xq-test' version '2.3.3'
    id 'xq-dev' version '2.2.1'
}

group = 'com.xqfitness'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    // Spring Boot Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring Boot Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Boot Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'

    // TestNG for component tests
    testImplementation 'org.testng:testng:7.8.0'

    // Rest Assured (needed by generated Rest Assured API client for component tests)
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'io.rest-assured:json-path:5.4.0'

    // PostgreSQL driver for component tests (DB seeding)
    testImplementation 'org.postgresql:postgresql'

    // Deps for generated Rest Assured client (compiled from generated-clients/ via sourceSets below)
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'io.gsonfire:gson-fire:1.9.0'
    testImplementation 'com.squareup.okio:okio:3.6.0'
    testImplementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    testImplementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    // Generated API client for component tests (published to Maven local by generateApiClient task)
    testImplementation 'com.xqfitness.client:read-service-client:1.2.0'
}

configurations.all {
    resolutionStrategy {
        force 'org.springframework:spring-core:6.2.2'
        force 'org.springframework:spring-web:6.2.2'
        force 'org.springframework:spring-context:6.2.2'
    }
}

// Configure test task to run both JUnit and TestNG tests
test {
    useJUnitPlatform()

    // Exclude TestNG component tests from JUnit runner
    exclude '**/component/**/*ApiComponentTest.class'
}

// Create separate task for component tests using TestNG
task componentTest(type: Test) {
    description = 'Runs component tests against real API endpoints using TestNG'
    group = 'verification'

    useTestNG() {
        suites 'src/test/resources/testng.xml'
    }

    // Only run component tests
    include '**/component/**/*ApiComponentTest.class'

    // Show stdout/stderr from tests (for REST Assured logging)
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed"
    }
}

apiClientGeneration {
    apiDefinitionFiles = ['read-service-api.yaml']
    library = 'rest-assured'
}

// Generate client before compiling tests
tasks.named('compileTestJava') {
    dependsOn('generateApiClient')
}